<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-6 backdrop-blur-sm"
>
  <!-- Modal -->
  <div
    class="w-full max-w-lg rounded-3xl border border-border-theme bg-base shadow-2xl"
  >
    <!-- Header -->
    <div class="border-b border-border-theme p-6">
      <div class="flex items-start gap-4">
        <!-- Icon -->
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-red-500/10"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 text-red-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-.01-12a9 9 0 100 18 9 9 0 000-18z"
            />
          </svg>
        </div>

        <!-- Title -->
        <div>
          <h2 class="text-xl font-bold text-text-base">
            Confirmar solicitud
          </h2>

          <p class="mt-1 text-sm leading-relaxed text-text-muted">
            Esta acción generará una solicitud de baja y no
            podrá deshacerse posteriormente.
          </p>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="p-6">
      <!-- Warning -->
      <div
        class="rounded-2xl border border-red-500/20 bg-red-500/5 p-4"
      >
        <p class="text-sm leading-relaxed text-text-muted">
          Para confirmar esta operación escribe
          <span class="font-semibold text-red-500">
            baja
          </span>
          en el siguiente campo.
        </p>
      </div>

      <!-- Input -->
      <div class="mt-5">
        <label
          class="mb-2 block text-sm font-medium text-text-base"
        >
          Confirmación
        </label>

        <input
          type="text"
          placeholder='Escribe "baja"'
          class="w-full rounded-2xl border border-border-theme bg-surface px-4 py-3 text-sm text-text-base placeholder:text-text-muted outline-none transition focus:border-red-500"
        />
      </div>
    </div>

    <!-- Footer -->
    <div
      class="flex flex-col gap-3 border-t border-border-theme p-6 sm:flex-row sm:justify-end"
    >
      <!-- Cancel -->
      <button
        type="button"
        class="rounded-2xl border border-border-theme bg-surface px-5 py-3 text-sm font-medium text-text-base transition hover:border-primary-theme"
      >
        Cancelar
      </button>

      <!-- Confirm -->
      <button
        type="button"
        class="rounded-2xl bg-red-500 px-5 py-3 text-sm font-semibold text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Confirmar baja
      </button>
    </div>
  </div>
</div>
