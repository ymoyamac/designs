<nav class="h-[60px] flex items-center px-6 gap-4 border-b
           bg-[#111318] border-white/[0.07]
           dark:bg-[#111318] dark:border-white/[0.07]
           light:bg-white light:border-slate-200">

  <!-- Logo -->
  <a routerLink="/#"
     class="text-[15px] font-semibold text-slate-200 bg-white/[0.06]
            border border-white/10 rounded-lg px-4 py-1.5
            tracking-tight whitespace-nowrap
            dark:text-slate-200
            hover:bg-white/10 transition-colors">
    <h2 class="text-sm font-semibold m-0">Logo</h2>
  </a>

  <!-- Nav links -->
  <div class="flex-1 flex justify-center">
    <a routerLink="/#"
       routerLinkActive="text-emerald-400 border-b-2 border-emerald-400"
       class="text-sm font-medium text-white/55 px-4 py-1.5 rounded-lg
              hover:text-white/80 hover:bg-white/[0.04]
              transition-colors relative">
      Solicitud
    </a>
  </div>

  <!-- Actions -->
  <div class="flex items-center gap-3">

    <!-- Theme toggle -->
    <button
      (click)="toggleTheme()"
      [attr.aria-label]="isDarkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      [class]="isDarkMode()
        ? 'w-11 h-6 rounded-full relative cursor-pointer transition-colors bg-[#1e2330] border border-white/10'
        : 'w-11 h-6 rounded-full relative cursor-pointer transition-colors bg-emerald-100 border border-emerald-300'">
      <span
        [class]="isDarkMode()
          ? 'absolute top-[3px] left-[3px] w-4 h-4 rounded-full bg-slate-500 transition-transform duration-200 flex items-center justify-center'
          : 'absolute top-[3px] left-[3px] w-4 h-4 rounded-full bg-emerald-600 transition-transform duration-200 translate-x-5 flex items-center justify-center'">
        @if (isDarkMode()) {
          <!-- Moon icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5 text-white" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        } @else {
          <!-- Sun icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5 text-white" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        }
      </span>
    </button>

    <!-- Profile -->
    <div class="relative navbar-profile">
      <button
        (click)="toggleDropdown()"
        class="w-9 h-9 rounded-full flex items-center justify-center
               text-[13px] font-semibold text-white
               bg-gradient-to-br from-emerald-900 to-emerald-400
               border-2 border-emerald-400/40
               hover:border-emerald-400/80 transition-colors">
        {{ user.initials }}
      </button>

      <!-- Dropdown -->
      @if (isDropdownOpen()) {
        <div class="absolute right-0 top-[calc(100%+10px)] w-52 z-50
                    bg-[#161b27] border border-white/[0.09] rounded-xl
                    shadow-[0_8px_32px_rgba(0,0,0,0.5)] p-1.5">

          <!-- Header -->
          <div class="px-3 py-2.5 border-b border-white/[0.07] mb-1">
            <p class="text-[13px] font-semibold text-slate-200">{{ user.name }}</p>
            <p class="text-[11px] text-emerald-400 mt-0.5">{{ user.role }} · {{ user.position }}</p>
          </div>

          <!-- Mi perfil -->
          <button
            (click)="onProfile(); closeDropdown()"
            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg
                   text-[13px] text-white/65
                   hover:bg-white/[0.06] hover:text-slate-200
                   transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Mi perfil
          </button>

          <div class="h-px bg-white/[0.07] mx-1.5 my-1"></div>

          <!-- Cerrar sesión -->
          <button
            (click)="onLogout()"
            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg
                   text-[13px] text-red-400
                   hover:bg-red-400/10 hover:text-red-300
                   transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar sesión
          </button>

        </div>
      }
    </div>
  </div>
</nav>
