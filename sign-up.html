<!-- register-page.component.html -->

<div class="min-h-screen bg-[#1E1B2E] flex items-center justify-center p-6">

  <div
    class="w-full max-w-md bg-[#2A243D] border border-[#3D3657] rounded-3xl p-8 shadow-2xl"
  >

    <!-- Header -->

    <div class="mb-8 text-center">

      <h1 class="text-3xl font-bold text-white">
        Create Account
      </h1>

      <p class="text-gray-400 mt-2">
        Register to access the portal
      </p>

    </div>

    <!-- Form -->

    <form
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()"
      class="space-y-5"
    >

      <!-- Name -->

      <div>

        <label class="label">

          <span class="label-text text-gray-300">
            Full Name
          </span>

        </label>

        <input
          type="text"
          formControlName="name"
          placeholder="John Doe"
          class="input input-bordered w-full bg-[#342E4C] border-[#4A4365] text-white"
        />

      </div>

      <!-- Email -->

      <div>

        <label class="label">

          <span class="label-text text-gray-300">
            Email
          </span>

        </label>

        <input
          type="email"
          formControlName="email"
          placeholder="john@company.com"
          class="input input-bordered w-full bg-[#342E4C] border-[#4A4365] text-white"
        />

      </div>

      <!-- Password -->

      <div>

        <label class="label">

          <span class="label-text text-gray-300">
            Password
          </span>

        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="input input-bordered w-full bg-[#342E4C] border-[#4A4365] text-white"
        />

      </div>

      <!-- Confirm Password -->

      <div>

        <label class="label">

          <span class="label-text text-gray-300">
            Confirm Password
          </span>

        </label>

        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="••••••••"
          class="input input-bordered w-full bg-[#342E4C] border-[#4A4365] text-white"
        />

        @if (
          registerForm.hasError('fieldsMismatch')
          &&
          confirmPassword.touched
        ) {

          <p class="text-error text-sm mt-2">
            Passwords do not match
          </p>

        }

      </div>

      <!-- Submit -->

      <button
        type="submit"
        class="btn btn-primary w-full mt-4"
        [disabled]="
          registerForm.invalid ||
          loading()
        "
      >

        @if (loading()) {

          <span
            class="loading loading-spinner loading-sm"
          ></span>

        } @else {

          <span>
            Create Account
          </span>

        }

      </button>

    </form>

    <!-- Footer -->

    <div class="mt-8 text-center">

      <p class="text-gray-400 text-sm">

        Already have an account?

        <a
          routerLink="/login"
          class="text-primary hover:text-primary-focus font-medium ml-1"
        >
          Sign in
        </a>

      </p>

    </div>

  </div>

</div>
