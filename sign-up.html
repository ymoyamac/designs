<section
  class="flex min-h-screen items-center justify-center bg-background px-6 py-10"
  data-theme="light"
>
  <div
    class="grid w-full max-w-5xl overflow-hidden rounded-3xl border border-border-theme bg-base shadow-xl lg:grid-cols-2"
  >
    <!-- Left Side -->
    <div
      class="hidden flex-col justify-center bg-primary-theme px-12 py-14 lg:flex"
    >
      <div>
        <div
          class="inline-flex rounded-2xl bg-white/15 px-4 py-2 text-sm font-semibold text-white"
        >
          Employee Portal
        </div>

        <h1
          class="mt-8 text-4xl font-bold leading-tight text-white"
        >
          Bienvenido de nuevo
        </h1>

        <p class="mt-5 text-md leading-relaxed text-white/80">
          Accede a tu cuenta para continuar gestionando tus
          solicitudes y operaciones.
        </p>
      </div>
    </div>

    <!-- Right Side -->
    <div class="flex items-center justify-center p-8 lg:p-14">
      <div class="w-full max-w-md">
        <!-- Header -->
        <div>
          <h2 class="text-3xl font-bold text-text-base">
            Iniciar sesión
          </h2>

          <p class="mt-2 text-sm text-text-muted">
            Ingresa tus credenciales
          </p>
        </div>

        <!-- Form -->
        <form class="mt-8 space-y-5">
          <!-- Email -->
          <div>
            <label
              class="mb-2 block text-sm font-medium text-text-base"
            >
              Correo
            </label>

            <input
              type="email"
              placeholder="correo@empresa.com"
              class="w-full rounded-2xl border border-border-theme bg-surface px-4 py-3 text-sm text-text-base placeholder:text-text-muted outline-none transition focus:border-primary-theme"
            />
          </div>

          <!-- Password -->
          <div>
            <label
              class="mb-2 block text-sm font-medium text-text-base"
            >
              Contraseña
            </label>

            <input
              type="password"
              placeholder="••••••••"
              class="w-full rounded-2xl border border-border-theme bg-surface px-4 py-3 text-sm text-text-base placeholder:text-text-muted outline-none transition focus:border-primary-theme"
            />
          </div>

          <!-- Actions -->
          <div class="flex items-center justify-between">
            <label
              class="flex items-center gap-2 text-sm text-text-muted"
            >
              <input
                type="checkbox"
                class="h-4 w-4 rounded border-border-theme"
              />

              Recordarme
            </label>

            <a
              href="#"
              class="text-sm font-medium text-primary-theme hover:underline"
            >
              Recuperar acceso
            </a>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full rounded-2xl bg-primary-theme px-5 py-3 text-sm font-semibold text-white transition hover:opacity-90"
          >
            Ingresar
          </button>
        </form>

        <!-- Footer -->
        <p class="mt-6 text-center text-sm text-text-muted">
          ¿No tienes cuenta?

          <a
            href="#"
            class="font-medium text-primary-theme hover:underline"
          >
            Registrarse
          </a>
        </p>
      </div>
    </div>
  </div>
</section>
